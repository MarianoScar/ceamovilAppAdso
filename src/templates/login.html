<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://fotografias.lasexta.com/clipping/cmsimages01/2019/03/26/0D81C498-1B2E-47A7-8EEE-C3B1D196799C/97.jpg?crop=1920,1080,x0,y101&width=1600&height=900&optimize=high&format=webply');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background-color: rgba(173, 216, 230, 0.9); /* Color similar a la imagen */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-container h3 {
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #000;
        }
        .form-control {
            border-radius: 5px;
        }
        .btn-login {
            background-color: #28a745;
            border-color: #28a745;
            font-weight: bold;
            width: 100%;
        }
        .forgot-password {
            color: #007bff;
            font-size: 0.9em;
        }
        /* Estilos para la notificación */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050; /* Asegura que la notificación esté por encima de otros elementos */
            opacity: 0.9; /* Hacerla ligeramente transparente */
        }
        .alert-custom {
            background-color: rgba(255, 0, 0, 0.8); /* Fondo rojo transparente */
            color: #fff; /* Color de texto blanco */
        }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="notification">
            <div class="alert alert-custom alert-dismissible fade show" role="alert">
                <ul class="flashes mb-0">
                    {% for category, message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    {% endif %}
    {% endwith %}
    
    <div class="login-container">
        <h3>CEAMOVILAPP</h3>
        
        <form action="/" method="post">
            <div class="form-group text-left">
                <label for="usuario">Usuario</label>
                <input type="text" class="form-control" id="usuario" name="nombre_usuario" placeholder="Ingrese su usuario" required>
            </div>
            <div class="form-group text-left">
                <label for="contraseña">Contraseña</label>
                <input type="password" class="form-control" id="contraseña" name="contraseña" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" class="btn btn-login">LOGIN</button>
            <div class="mt-3">
                <a href="/recuperar_contraseña" class="forgot-password">¿Olvidé mi contraseña?</a>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
