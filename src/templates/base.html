<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} </title>
   
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .logo {
          border-radius: 10px;
          height: 40px;
          width: 25%;
        }
        .bi {
          font-size: 100px;
          color: aliceblue;
        }
        #sidebar {
          position: sticky;
          top: 0;
          height: 100vh;
          overflow: hidden;
        }
        .form-container {
          max-height: calc(100vh - 56px); 
          overflow-y: auto;
        }

        .appName{
            color: darkorange;
        }

        .image-container img {
            border-radius: 10px; 
            transition: transform 0.3s ease; 
        }

        .image-container img:hover {
            transform: scale(1.05); 
        }

        .image-container {
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>
    
  <div class="container-fluid">
        <!--Esta es la barra superior-->
        <div class="row">
            <div class="col-12 p-0">
                <nav class="navbar navbar-dark bg-dark">
                    <h1 class="appName"><a href="/">CEAMOVILAPP</a></h1>
                    <button class="btn btn-outline-success" type="submit">Logout</button>
                </nav>
            </div>
        </div>

    
        <div class="row vh-100">
        <!--Esta es la barra lateral-->
            <div class="col-2 p-0">
                <div id="sidebar" class="d-flex flex-column align-items-center justify-content-center p-3 bg-dark h-100">
                    <i class="bi bi-person-fill p-0"></i>
                    <h4>User</h4>
                    <div class="d-flex flex-column align-items-center justify-content-center">
                        <ul class="list-unstyled">
                            <li class="btn btn-warning w-100 mb-3"><a href="/estudiantes">ESTUDIANTES</a></li>
                            <li class="btn btn-warning w-100 mb-3"><a href="/cursos">CURSOS</a></li>
                            <li class="btn btn-warning w-100 mb-3"><a href="#">CLASES TEORICAS</a></li>
                            <li class="btn btn-warning w-100 mb-3"><a href="#">CLASES PRACTICAS</a></li>
                        </ul>
                    </div>
                </div>
            </div>   

            {% block content %}
                    <!-- aqui voy a colocar el contenido principal de las de mas vistas-->

                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="flash-messages">
                                {% for message in messages %}
                                    <div class="alert alert-info">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            </div>
                        {% endif %}
                    {% endwith %}


            {% endblock %}
      
        </div>

    </div>
 
    
      
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
   
</body>
</html>
