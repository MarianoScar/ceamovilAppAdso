{% extends "base.html" %}

{% block title %}Instancias de Cursos{% endblock %}

{% block content %}

<div class="col-10 form-container">

  
    
    <h2>Crea un nuevo Curso</h2>
    <form action="/crear-cursos" method="post">
        <div class="mb-3">
            <label for="curso_id" class="form-label">Selecciona el Curso</label>
            <select name="curso_id" required>
                <option value="">Selecciona un curso</option>
                {% for curso in cursos %}
                    <option value="{{ curso.id }}">{{ curso.nombre_curso }}</option>
                {% endfor %}
            </select>

            <select name="instructor_id" required>
                <option value="">Selecciona un instructor</option>
                {% for instructor in instructores %}
                    <option value="{{ instructor.id }}">{{ instructor.nombre_instructor }}</option>
                {% endfor %}
            </select>
    
    </div>
        <div class="mb-3">
            <label for="fecha_inicio" class="form-label">Fecha de Inicio</label>
            <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
        </div>

        <div class="mb-3">
            <label for="fecha_fin" class="form-label">Fecha de Fin</label>
            <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" required>
        </div>

        <h3>Lista de Cursos Inicializados</h3>
   <!-- <ul>
    {% for curso in cursos %}
        <li>{{ curso.nombre_curso }}</li>
    {% else %}
        <li>No hay cursos inicializados.</li>
    {% endfor %}
    </ul>
    -->


        <button type="submit" class="btn btn-primary">Abrir Curso</button>
    </form>

    
</div>
{% endblock %}
