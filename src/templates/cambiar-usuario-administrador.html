<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crea usuario nuevo{% endblock %} </title>
   
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        
        body {
            background-image: url('https://fotografias.lasexta.com/clipping/cmsimages01/2019/03/26/0D81C498-1B2E-47A7-8EEE-C3B1D196799C/97.jpg?crop=1920,1080,x0,y101&width=1600&height=900&optimize=high&format=webply');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background-color: rgba(173, 216, 230, 0.9); 
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-container h3 {
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #000;
        }
        .form-control {
            border-radius: 5px;
        }
        .btn-login {
            background-color: #28a745;
            border-color: #28a745;
            font-weight: bold;
            width: 100%;
        }
        .forgot-password {
            color: #007bff;
            font-size: 0.9em;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050; 
            opacity: 0.9; 
        }
        .alert-custom {
            background-color: rgba(255, 0, 0, 0.8); 
            color: #fff; 
        }
    </style>
</head>
 
<body>  
    

    
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="notification">
            {% for message in messages %}
                <div class="alert alert-custom">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% endwith %}


    <div class="login-container">
        <h3>Cambiar usuario provisional a administrador</h3>
        <form action="{{ url_for('cambiar_provisional_administrador', id_usuario=id_usuario) }}" method="post">
            <div class="mb-3 text-left">
                <label for="nombre_usuario" class="form-label ">Nombre de usuario:</label>
                <input type="text" name="nombre_usuario" id="nombre_usuario" class="form-control" required>
            </div>
            <div class="mb-3 text-left">
                <label for="contraseña" class="form-label ">Contraseña:</label>
                <input type="password" name="contraseña" id="contraseña" class="form-control" required>
            </div>
            <!--<div class="mb-3">
                <label for="rol" class="form-label, text-left">Rol:</label>
                <select name="rol" id="rol" class="form-select" required>
                    <option value="usuario">Usuario</option>
                    <option selected value="administrador">Administrador</option>
                </select>
            </div>-->
            <button type="submit" class="btn btn-login">Crear Usuario</button>
        </form>
    </div>
                        
                    



<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" type="text/javascript"></script>


</body>





</html>
